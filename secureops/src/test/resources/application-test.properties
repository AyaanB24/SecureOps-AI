# Test Configuration Profile (spring.profiles.active=test)
# Used to override application.properties for test environment

# Database Configuration - Use same PostgreSQL but with test database
spring.datasource.url=jdbc:postgresql://localhost:5432/secureops_test?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=root123
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA/Hibernate Configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration for tests
# Set JWT secret to allow token validation in tests
app.jwt.secret=test-secret-key-32-characters-long!
app.jwt.expiration-ms=3600000

# Logging - Less verbose in tests
logging.level.root=WARN
logging.level.com.secureops=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Disable SSL for tests
server.ssl.enabled=false
