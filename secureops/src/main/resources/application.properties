spring.application.name=secureops
server.port=8081

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/secureops?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=root123
spring.jpa.hibernate.ddl-auto=update

# HikariCP Connection Pool - Do NOT fail on startup if DB unavailable
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.secureops=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=1MB

# Report Storage Configuration
secureops.reports.storage-path=./reports

# Debug multipart upload
logging.level.org.springframework.web.multipart=DEBUG

# Disable HTTPS - use plain HTTP on 8081
server.ssl.enabled=false

# JWT Configuration (Phase 4)
# Secret key read from environment variable: APP_JWT_SECRET
# If not set, uses development default (NEVER use in production)
app.jwt.secret=${APP_JWT_SECRET:MySecureSecretKeyForDevelopmentOnlyChangeInProduction12345}
# Token expiration: 1 hour (3600000 milliseconds)
app.jwt.expiration-ms=3600000


# OAuth Configuration
# GitHub OAuth
app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:5173/auth/github/callback}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/google/callback}

# AI Analysis Configuration (Gemini)
# API key stored in environment variable (never in code or git)
gemini.api.key=${GEMINI_API_KEY:}
# Model configuration (easily changeable)
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash}
# Gemini API base URL
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
